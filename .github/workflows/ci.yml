name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests & validate honeypots.json
        run: |
          python -m json.tool data/honeypots.json > /dev/null
          python -m unittest discover -s tests -v
