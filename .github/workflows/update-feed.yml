name: Auto-Update Honeypot Feed

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan GitHub & update published honeypot lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python bounty_guard.py scan --update-db --limit 25
      - name: Commit updated HONEYPOTS.md and data/honeypots.json if changed
        run: |
          if [[ -n "$(git status --porcelain data/honeypots.json HONEYPOTS.md)" ]]; then
            git config user.name "doomsday-network-bot"
            git config user.email "bot@doomsday.network"
            git add data/honeypots.json HONEYPOTS.md
            git commit -m "chore(feed): auto-update published honeypot registry"
            git push
          fi
